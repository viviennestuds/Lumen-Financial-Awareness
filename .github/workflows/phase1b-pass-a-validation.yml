name: Phase 1B Pass A Validation

on:
  pull_request:
    paths:
      - 'ios-lumen-finance/LumenFinance/Data/Evidence/**'
      - 'ios-lumen-finance/LumenFinanceTests/EvidencePassAPrimitiveTests.swift'
      - '.github/workflows/phase1b-pass-a-validation.yml'

permissions:
  contents: read

jobs:
  pass-a:
    name: Build and test Pass A primitives
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT_PATH: ios-lumen-finance/LumenFinance.xcodeproj
      SCHEME: LumenFinance
      OUTPUT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p "$OUTPUT_DIR"

      - name: Record environment
        run: |
          set -euo pipefail
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "macos_version=$(sw_vers -productVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "iphonesimulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)"
          } | tee "$OUTPUT_DIR/environment.txt"

      - name: Create latest available iPhone simulator
        run: |
          set -euo pipefail

          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          items = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name", "")]
          if not items:
              raise SystemExit("No available iOS simulator runtime")
          def version(r):
              return tuple(int(p) if p.isdigit() else 0 for p in r.get("version", "0").split("."))
          print(max(items, key=version)["identifier"])
          ')

          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          items = [d for d in json.load(sys.stdin)["devicetypes"] if d.get("name", "").startswith("iPhone")]
          preferred = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          for name in preferred:
              match = next((d for d in items if d.get("name") == name), None)
              if match:
                  print(match["identifier"])
                  break
          else:
              print(items[-1]["identifier"])
          ')

          UDID=$(xcrun simctl create "Lumen-PassA-${GITHUB_RUN_ID}" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run full unit-test target
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/LumenPassADerivedData" \
            -resultBundlePath "$OUTPUT_DIR/pass-a.xcresult" \
            -only-testing:LumenFinanceTests \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-test.log"

      - name: Extract summary
        if: always()
        run: |
          set -euo pipefail
          grep -E 'Test Suite|Executed|TEST SUCCEEDED|TEST FAILED|error:' "$OUTPUT_DIR/xcodebuild-test.log"             | tail -n 120 | tee "$OUTPUT_DIR/test-summary.txt" || true

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lumen-Phase1B-PassA-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup simulator
        if: always()
        run: |
          set +e
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi
