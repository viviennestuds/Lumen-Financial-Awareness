name: Phase 1C Financial Date Characterization TEMP

on:
  push:
    branches:
      - docs/phase1c-portable-v1-financial-date-semantics-proposal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize-financial-dates:
    name: Bounded financial-date probes
    runs-on: macos-26
    timeout-minutes: 30

    env:
      OUTPUT_DIR: ${{ github.workspace }}/artifacts
      PROJECT: ${{ github.workspace }}/ios-lumen-finance/LumenFinance.xcodeproj
      SCHEME: LumenFinance

    steps:
      - name: Check out proposal revision
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p "$OUTPUT_DIR"

      - name: Record toolchain and revision
        run: |
          set -euo pipefail
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "github_sha=$GITHUB_SHA"
            echo "github_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "macos_version=$(sw_vers -productVersion)"
            echo "xcode_path=$(xcode-select -p)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "iphonesimulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "recorded_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } | tee "$OUTPUT_DIR/toolchain.txt"

      - name: Create characterization simulator
        id: simulator
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          items=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name","")]
          if not items: raise SystemExit("No available iOS simulator runtime")
          def ver(r): return tuple(int(p) if p.isdigit() else 0 for p in r.get("version","0").split("."))
          print(max(items,key=ver)["identifier"])
          ')
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          items=[d for d in json.load(sys.stdin)["devicetypes"] if d.get("name","").startswith("iPhone")]
          if not items: raise SystemExit("No iPhone simulator device type")
          for name in ["iPhone 16 Pro","iPhone 16","iPhone 15 Pro","iPhone 15"]:
              m=next((d for d in items if d.get("name")==name),None)
              if m:
                  print(m["identifier"]); break
          else: print(items[-1]["identifier"])
          ')
          UDID=$(xcrun simctl create "Lumen-FinancialDate-$GITHUB_RUN_ID" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          printf 'runtime_id=%s\ndevice_type_id=%s\nudid=%s\n' "$RUNTIME_ID" "$DEVICE_TYPE_ID" "$UDID" > "$OUTPUT_DIR/simulator-environment.txt"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run bounded financial-date characterization
        run: |
          set -o pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:LumenFinanceTests/LumenFinanceTests/testFinancialDateProbeSameInstantProjectsToDifferentGregorianDaysAcrossTimeZones \
            -only-testing:LumenFinanceTests/LumenFinanceTests/testFinancialDateProbeCalendarSystemChangesYearMonthDayInterpretation \
            -only-testing:LumenFinanceTests/LumenFinanceTests/testFinancialDateProbeDSTCivilDaysAreNotUniformTwentyFourHourIntervals \
            -only-testing:LumenFinanceTests/LumenFinanceTests/testFinancialDateProbeFixedZoneRestorationAnchorCanRenderAsAdjacentDayElsewhere \
            -only-testing:LumenFinanceTests/LumenFinanceTests/testFinancialDateProbePostedDatePresenceIsStructurallyIndependentOfStatus \
            -resultBundlePath "$OUTPUT_DIR/financial-date-characterization.xcresult" \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild.log"

      - name: Record selected-result summary
        if: always()
        run: |
          {
            echo "github_sha=$GITHUB_SHA"
            grep -E "Test Case '-\[LumenFinanceTests\.LumenFinanceTests testFinancialDateProbe|\*\* TEST (SUCCEEDED|FAILED) \*\*" "$OUTPUT_DIR/xcodebuild.log" || true
          } | tee "$OUTPUT_DIR/financial-date-summary.txt"

      - name: Upload characterization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lumen-Phase1C-FinancialDate-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup simulator
        if: always()
        run: |
          set +e
          UDID="${{ steps.simulator.outputs.udid }}"
          if [ -n "$UDID" ]; then
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$UDID" >/dev/null 2>&1 || true
          fi
          exit 0
