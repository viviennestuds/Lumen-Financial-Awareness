name: Phase 1B Pass C Validation

on:
  push:
    branches:
      - feat/phase1b-evidence-retention-pass-c

permissions:
  contents: read

concurrency:
  group: phase1b-pass-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass-c:
    name: Build and test Pass C coordination
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT_PATH: ios-lumen-finance/LumenFinance.xcodeproj
      SCHEME: LumenFinance
      OUTPUT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p "$OUTPUT_DIR"

      - name: Record environment
        run: |
          set -euo pipefail
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "macos_version=$(sw_vers -productVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "iphonesimulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)"
          } | tee "$OUTPUT_DIR/environment.txt"

      - name: Create latest available iPhone simulator
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          items = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name", "")]
          if not items: raise SystemExit("No available iOS simulator runtime")
          def version(r): return tuple(int(p) if p.isdigit() else 0 for p in r.get("version", "0").split("."))
          print(max(items, key=version)["identifier"])
          ')
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          items = [d for d in json.load(sys.stdin)["devicetypes"] if d.get("name", "").startswith("iPhone")]
          preferred = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          for name in preferred:
              match = next((d for d in items if d.get("name") == name), None)
              if match:
                  print(match["identifier"])
                  break
          else:
              print(items[-1]["identifier"])
          ')
          UDID=$(xcrun simctl create "Lumen-PassC-${GITHUB_RUN_ID}" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run focused Pass C tests
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/LumenPassCDerivedData" \
            -resultBundlePath "$OUTPUT_DIR/pass-c-focused.xcresult" \
            -only-testing:LumenFinanceTests/EvidencePassCConfirmationTests \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-focused.log"

      - name: Run full unit-test target
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/LumenPassCDerivedData" \
            -resultBundlePath "$OUTPUT_DIR/pass-c-full.xcresult" \
            -only-testing:LumenFinanceTests \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-full.log"

      - name: Extract summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "=== Focused Pass C ==="
            grep -E 'Test Suite|Executed|TEST SUCCEEDED|TEST FAILED|error:|warning:' "$OUTPUT_DIR/xcodebuild-focused.log" | tail -n 220 || true
            echo
            echo "=== Full unit target ==="
            grep -E 'Test Suite|Executed|TEST SUCCEEDED|TEST FAILED|error:|warning:' "$OUTPUT_DIR/xcodebuild-full.log" | tail -n 280 || true
          } | tee "$OUTPUT_DIR/test-summary.txt"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lumen-Phase1B-PassC-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup simulator
        if: always()
        run: |
          set +e
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi
