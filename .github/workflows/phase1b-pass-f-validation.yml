name: Phase 1B Pass F Validation

on:
  push:
    branches:
      - feat/phase1b-evidence-retention-pass-f

permissions:
  contents: read

concurrency:
  group: phase1b-pass-f-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    name: Unit, UI, schema, and repository hygiene
    runs-on: macos-26
    timeout-minutes: 50

    env:
      PROJECT_PATH: ios-lumen-finance/LumenFinance.xcodeproj
      SCHEME: LumenFinance
      OUTPUT_DIR: ${{ github.workspace }}/artifacts/release
      PHASE1B_BASELINE_SHA: 5e8397c4bd37e888185314a9fa11848d5c5ba30d

    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        run: mkdir -p "$OUTPUT_DIR"

      - name: Record environment
        run: |
          set -euo pipefail
          {
            echo "candidate_sha=${GITHUB_SHA}"
            echo "phase1b_baseline_sha=${PHASE1B_BASELINE_SHA}"
            echo "macos_version=$(sw_vers -productVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "iphonesimulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)"
          } | tee "$OUTPUT_DIR/environment.txt"

      - name: Verify Phase 1B schema surface unchanged
        run: |
          set -euo pipefail
          git diff --exit-code "$PHASE1B_BASELINE_SHA" --             ios-lumen-finance/LumenFinance/Models/Models.swift             ios-lumen-finance/LumenFinance/Data/LedgerStore.swift             | tee "$OUTPUT_DIR/schema-diff.txt"
          if git grep -n -E 'SchemaMigrationPlan|VersionedSchema|MigrationStage' --               ios-lumen-finance/LumenFinance               > "$OUTPUT_DIR/migration-symbols.txt"; then
            echo "Unexpected explicit schema migration symbol found."
            cat "$OUTPUT_DIR/migration-symbols.txt"
            exit 1
          fi
          echo "No Phase 1B schema/model delta or explicit migration plan detected."             | tee "$OUTPUT_DIR/schema-verification.txt"

      - name: Inventory media and diagnostic artifacts across repository history
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$OUTPUT_DIR/repository-media-history.txt"
          import subprocess

          allowed = {
              "ios-lumen-finance/LumenFinance/Assets.xcassets/AppIcon.appiconset/icon.png"
          }
          suffixes = (
              ".png", ".jpg", ".jpeg", ".heic", ".heif", ".gif", ".webp",
              ".pdf", ".zip", ".xcresult"
          )

          raw = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"],
              text=True,
          )
          paths = set()
          for line in raw.splitlines():
              parts = line.split(" ", 1)
              if len(parts) != 2:
                  continue
              path = parts[1]
              if path.lower().endswith(suffixes):
                  paths.add(path)

          for path in sorted(paths):
              print(path)

          unexpected = sorted(path for path in paths if path not in allowed)
          if unexpected:
              raise SystemExit(
                  "Unexpected media/diagnostic artifact paths in repository history: "
                  + ", ".join(unexpected)
              )

          print("PASS: only approved production app artwork appears in media/diagnostic history inventory")
          PY

      - name: Create latest available iPhone simulator
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          items = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name", "")]
          if not items: raise SystemExit("No available iOS simulator runtime")
          def version(r): return tuple(int(p) if p.isdigit() else 0 for p in r.get("version", "0").split("."))
          print(max(items, key=version)["identifier"])
          ')
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          items = [d for d in json.load(sys.stdin)["devicetypes"] if d.get("name", "").startswith("iPhone")]
          preferred = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          for name in preferred:
              match = next((d for d in items if d.get("name") == name), None)
              if match:
                  print(match["identifier"])
                  break
          else:
              print(items[-1]["identifier"])
          ')
          UDID=$(xcrun simctl create "Lumen-PassF-${GITHUB_RUN_ID}" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run complete unit target
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/LumenPassFDerivedData" \
            -resultBundlePath "$OUTPUT_DIR/pass-f-units.xcresult" \
            -only-testing:LumenFinanceTests \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-units.log"

      - name: Run Pass F acceptance UI paths
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/LumenPassFDerivedData" \
            -resultBundlePath "$OUTPUT_DIR/pass-f-ui-acceptance.xcresult" \
            -only-testing:LumenFinanceUITests/LumenFinanceUITests/testManualReviewSaveRelaunchInspectEditStatusAndDelete \
            -only-testing:LumenFinanceUITests/LumenFinanceUITests/testSettingsPrivacyCopyReflectsLocalAndPlatformBackupPosture \
            -only-testing:LumenFinanceUITests/LumenFinanceUITests/testUploadCopyReflectsRetainedAndSaveWithoutEvidenceOutcomes \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-ui-acceptance.log"

      - name: Run complete UI target for classification evidence
        if: always()
        id: full_ui
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/LumenPassFFullUIDerivedData" \
            -resultBundlePath "$OUTPUT_DIR/pass-f-ui-full.xcresult" \
            -only-testing:LumenFinanceUITests \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-ui-full.log"

      - name: Record complete UI target disposition
        if: always()
        run: |
          {
            echo "full_ui_step_outcome=${{ steps.full_ui.outcome }}"
            echo "The complete UI target includes retained characterization/probe tests."
            echo "Interpret failures under docs/knowledge/testing/ios-runtime-validation.md."
          } | tee "$OUTPUT_DIR/ui-disposition.txt"

      - name: Extract release summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "=== Units ==="
            grep -E 'Test Suite|Executed|TEST SUCCEEDED|TEST FAILED|error:|warning:' "$OUTPUT_DIR/xcodebuild-units.log" | tail -n 420 || true
            echo
            echo "=== Acceptance UI ==="
            grep -E 'Test Suite|Test Case|Executed|TEST SUCCEEDED|TEST FAILED|error:|warning:' "$OUTPUT_DIR/xcodebuild-ui-acceptance.log" | tail -n 420 || true
            echo
            echo "=== Full UI characterization ==="
            grep -E 'Test Suite|Test Case|Executed|TEST SUCCEEDED|TEST FAILED|error:|warning:' "$OUTPUT_DIR/xcodebuild-ui-full.log" | tail -n 520 || true
          } | tee "$OUTPUT_DIR/test-summary.txt"

      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lumen-Phase1B-PassF-Release-${{ github.run_number }}
          path: artifacts/release/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup simulator
        if: always()
        run: |
          set +e
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi

  existing-store-compatibility:
    name: Authentic existing-store compatibility
    runs-on: macos-26
    timeout-minutes: 60

    env:
      BASELINE_SHA: dbc28ed9649d4930b45e2dcc44a7462729dfcf11
      EXPECTED_BUNDLE_ID: app.rork.8m36zsug0ex00d13e28li
      OUTPUT_DIR: ${{ github.workspace }}/artifacts/compatibility
      CURRENT_ROOT: ${{ github.workspace }}/current
      BASELINE_ROOT: ${{ github.workspace }}/baseline

    steps:
      - name: Check out Pass F candidate
        uses: actions/checkout@v7
        with:
          path: current

      - name: Check out canonical pre-Phase-1A baseline
        uses: actions/checkout@v7
        with:
          ref: dbc28ed9649d4930b45e2dcc44a7462729dfcf11
          path: baseline

      - name: Prepare evidence directory
        run: mkdir -p "$OUTPUT_DIR"

      - name: Record compatibility environment
        run: |
          set -euo pipefail
          {
            echo "candidate_github_sha=${GITHUB_SHA}"
            echo "baseline_requested_sha=${BASELINE_SHA}"
            echo "macos_version=$(sw_vers -productVersion)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "iphonesimulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)"
          } | tee "$OUTPUT_DIR/toolchain.txt"

      - name: Run authentic Phase 1A existing-store compatibility harness
        run: |
          set -euo pipefail
          chmod +x current/scripts/phase1a-existing-store-compatibility.sh
          current/scripts/phase1a-existing-store-compatibility.sh

      - name: Finalize fallback report
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$OUTPUT_DIR/compatibility-report.txt" ]; then
            printf '%s\n' \
              'baseline_sha=UNESTABLISHED' \
              "candidate_sha=${GITHUB_SHA}" \
              'phase1a_compatibility_gate=NOT_SATISFIED' \
              'failed_boundary=HARNESS_INITIALIZATION' \
              > "$OUTPUT_DIR/compatibility-report.txt"
          fi
          cat "$OUTPUT_DIR/compatibility-report.txt"

      - name: Upload existing-store evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lumen-Phase1B-PassF-ExistingStore-${{ github.run_number }}
          path: artifacts/compatibility/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup compatibility simulators
        if: always()
        run: |
          set +e
          if [ -f "$OUTPUT_DIR/simulators.txt" ]; then
            while IFS= read -r udid; do
              [ -n "$udid" ] || continue
              xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
              xcrun simctl delete "$udid" >/dev/null 2>&1 || true
            done < "$OUTPUT_DIR/simulators.txt"
          fi
